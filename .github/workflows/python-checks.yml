name: Python Checks

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Code Quality (Lint & Format)
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: "3.8"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    
    - name: Black format check
      run: black --check --diff train_baseline.py eval_fp32.py compare_metrics.py
      continue-on-error: true
    
    - name: isort import check
      run: isort --check-only train_baseline.py eval_fp32.py compare_metrics.py
      continue-on-error: true
    
    - name: Flake8 lint
      run: flake8 train_baseline.py eval_fp32.py compare_metrics.py --max-line-length=100
      continue-on-error: true
    
    - name: Type hints with mypy
      run: mypy train_baseline.py eval_fp32.py --ignore-missing-imports
      continue-on-error: true

  tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: lint
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: "3.8"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run pytest with coverage
      run: pytest tests/ -v --cov=. --cov-report=xml
      continue-on-error: true
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false
      continue-on-error: true